name: Shadow Retracement - Scan

on:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'   # décalé du top de l'heure pour éviter les pics de charge GitHub
  workflow_dispatch: {}

permissions:
  contents: write   # nécessaire pour recommiter state.json (la mémoire)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: pip install pandas numpy requests websocket-client

      - name: Lancer le scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 fetch_and_scan.py

      - name: Sauvegarder la mémoire (setups + historique de prix)
        run: |
          git config user.name "shadow-retracement-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json history_*.csv
          git diff --staged --quiet || git commit -m "Mise à jour mémoire [skip ci]"
          git push
